<!DOCTYPE html>
<html>
<head>
    <title>OTT Sign Up</title>
</head>

<body>

    <h1>OTT Sign Up</h1>

    <form>

        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Preferred Plan:</label>

        <select name="plan">
            <option>Basic</option>
            <option>Standard</option>
            <option>Premium</option>
            <option>Family</option>
        </select>

        <br><br>

        <input type="submit" value="Sign Up">

    </form>

    <br>

    <a href="index.html">Back to Plans</a>

</body>
</html>
